spring:
  application:
    name: geo-track-api

  threads:
    virtual:
      enabled: true

  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Cadastro de veículos e rastreamento de posições GPS